<div class="bg-white p-8 rounded-[2.5rem] border border-slate-200/60 shadow-sm space-y-8 animate-in fade-in duration-500">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    
    <div class="relative">
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2 ml-1">Colaborador / Matrícula</label>
      <div class="relative group">
        <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg transition-colors group-focus-within:text-blue-500"></i>
        
        <i *ngIf="buscandoSugestoes" class="ph ph-circle-notch absolute right-4 top-1/2 -translate-y-1/2 text-blue-500 animate-spin"></i>

        <i *ngIf="filtros.colaboradorMatricula && !buscandoSugestoes" 
           (click)="limparColaborador()" 
           class="ph ph-x-circle absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-red-500 cursor-pointer transition-colors z-10 text-lg">
        </i>

        <input type="text" 
          [(ngModel)]="filtros.colaboradorMatricula" 
          (input)="buscarColaboradores(filtros.colaboradorMatricula)"
          (blur)="fecharSugestoes()"
          placeholder="Nome ou Matrícula" 
          class="w-full pl-12 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700">
        
        <ul *ngIf="exibirSugestoes" 
          class="absolute z-[999] w-full bg-white border border-slate-100 rounded-2xl mt-2 shadow-2xl max-h-64 overflow-y-auto p-2 animate-in slide-in-from-top-2 duration-200">
          <li *ngFor="let colab of sugestoesColaboradores" 
            (mousedown)="selecionarColaborador(colab)"
            class="px-4 py-3 hover:bg-blue-50 rounded-xl cursor-pointer text-sm flex flex-col transition-colors mb-1 last:mb-0">
            <span class="font-bold text-slate-700">{{ colab.nome }}</span>
            <span class="text-blue-500 text-[10px] font-bold uppercase tracking-wider">Matrícula: {{ colab.matricula }}</span>
          </li>
        </ul>
      </div>
    </div>

    <div>
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2 ml-1">Data Início</label>
      <div class="relative group">
        <i class="ph ph-calendar-blank absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg transition-colors group-focus-within:text-blue-500"></i>
        <input type="date" [(ngModel)]="filtros.dataInicio" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700">
      </div>
    </div>

    <div>
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2 ml-1">Data Fim</label>
      <div class="relative group">
        <i class="ph ph-calendar-blank absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg transition-colors group-focus-within:text-blue-500"></i>
        <input type="date" [(ngModel)]="filtros.dataFim" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700">
      </div>
    </div>

    <div>
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2 ml-1">Mês de Referência</label>
      <div class="relative group">
        <i class="ph ph-calendar-check absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg transition-colors group-focus-within:text-blue-500 pointer-events-none"></i>
        <select [(ngModel)]="filtros.mesReferencia" class="w-full pl-12 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700 appearance-none cursor-pointer">
          <option value="">Selecione o mês...</option>
          <option *ngFor="let mes of meses" [value]="mes.valor">{{ mes.nome }}</option>
        </select>
        <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
      </div>
    </div>

    <div>
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2 ml-1">Nº do Protocolo</label>
      <input type="text" [(ngModel)]="filtros.protocolo" placeholder="Ex: 0001/2026" class="w-full px-5 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700">
    </div>

    <div>
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2 ml-1">Usuário (Emissor)</label>
      <input type="text" [(ngModel)]="filtros.usuario" placeholder="Nome do emissor" class="w-full px-5 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700">
    </div>

    <div>
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2 ml-1">Código Material</label>
      <input type="text" [(ngModel)]="filtros.codigoMaterial" placeholder="Cód. Interno" class="w-full px-5 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700">
    </div>

    <div>
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2 ml-1">C.A do Material</label>
      <input type="text" [(ngModel)]="filtros.ca" placeholder="Certificado de Aprovação" class="w-full px-5 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700">
    </div>

  </div>

  <div class="flex justify-end gap-4 pt-6 border-t border-slate-50">
    <button type="button" (click)="limpar()" class="px-6 py-3 text-sm font-bold text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-2xl transition-all">
      Limpar Filtros
    </button>
    <button type="button" (click)="buscar()" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3.5 rounded-2xl text-sm font-bold flex items-center justify-center gap-2 transition-all shadow-xl shadow-blue-500/20 active:scale-95">
      <i class="ph ph-magnifying-glass text-lg"></i>
      <span>Consultar Registros</span>
    </button>
  </div>
</div>
