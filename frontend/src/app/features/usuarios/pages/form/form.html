<section class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300">
  <div class="bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300 flex flex-col">
    
    <header class="px-8 py-6 border-b border-slate-50 flex justify-between items-center bg-slate-50/30">
      <hgroup class="flex items-center gap-3">
        <div class="p-2.5 bg-blue-50 text-blue-600 rounded-2xl shadow-sm">
          <i class="ph" [ngClass]="userData ? 'ph-user-circle-plus' : 'ph-user-plus'"></i>
        </div>
        <div>
          <h3 class="font-bold text-slate-800 text-lg tracking-tight">{{ userData ? 'Editar' : 'Novo' }} Usuário</h3>
          <p class="text-[10px] text-blue-600 font-bold uppercase tracking-widest mt-0.5">Definições de conta</p>
        </div>
      </hgroup>
      <button type="button" (click)="close()" class="p-2 hover:bg-white rounded-xl text-slate-400 transition-colors shadow-sm border border-transparent hover:border-slate-100">
        <i class="ph ph-x text-xl"></i>
      </button>
    </header>

    <div *ngIf="submitError" class="mx-8 mt-6 rounded-2xl border border-red-100 bg-red-50/50 px-5 py-3 text-xs font-bold text-red-600 uppercase tracking-tight flex items-center gap-2 animate-in shake">
      <i class="ph ph-warning-circle text-lg"></i>
      {{ submitError }}
    </div>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="p-8 space-y-6">
      
      <div class="space-y-2">
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Nome Completo</label>
        <div class="relative group">
          <i class="ph ph-identification-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-blue-500 transition-colors"></i>
          <input 
            type="text" 
            formControlName="nome"
            placeholder="Ex: João Silva"
            class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-700 outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all">
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">E-mail Corporativo</label>
        <div class="relative group">
          <i class="ph ph-envelope-simple absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-blue-500 transition-colors"></i>
          <input 
            type="email" 
            formControlName="email"
            placeholder="joao@empresa.com"
            class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-700 outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Senha de Acesso</label>
          <div class="relative group">
            <i class="ph ph-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-blue-500 transition-colors"></i>
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              formControlName="senha"
              placeholder="••••••••"
              class="w-full pl-12 pr-12 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-700 outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all">
            <button type="button" (click)="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-500 transition-colors">
              <i class="ph text-xl" [ngClass]="showPassword ? 'ph-eye-slash' : 'ph-eye'"></i>
            </button>
          </div>
          <p *ngIf="userData" class="text-[9px] text-slate-400 font-bold uppercase tracking-tighter mt-1.5 ml-1">
            <i class="ph ph-info mr-1"></i> Deixe vazio para não alterar
          </p>
        </div>

        <div class="space-y-2">
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Perfil (Role)</label>
          <div class="relative group">
            <i class="ph ph-shield-check absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-blue-500 transition-colors z-10"></i>
            <select formControlName="role" class="w-full pl-12 pr-10 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-700 outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all appearance-none cursor-pointer relative">
              <option value="admin">Administrador</option>
              <option value="almoxarife">Almoxarife</option>
            </select>
            <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none transition-transform group-focus-within:rotate-180"></i>
          </div>
        </div>
      </div>

      <footer class="flex justify-end gap-4 pt-6">
        <button type="button" (click)="close()" class="px-8 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-2xl transition-all">
          Cancelar
        </button>
        <button type="submit" 
                [disabled]="userForm.invalid"
                class="px-10 py-4 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:shadow-none text-white text-sm font-black uppercase tracking-widest rounded-2xl shadow-xl shadow-blue-500/20 transition-all active:scale-95 flex items-center gap-3">
          <i class="ph ph-check-circle text-xl"></i>
          Salvar Dados
        </button>
      </footer>
    </form>
  </div>
</section>
