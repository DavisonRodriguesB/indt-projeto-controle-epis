<main class="min-h-screen bg-slate-50 flex items-center justify-center p-4 relative overflow-hidden">
  <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-blue-100/50 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-indigo-100/50 rounded-full blur-3xl pointer-events-none"></div>

  <section class="w-full max-w-md bg-white border border-gray-100 rounded-3xl shadow-xl shadow-slate-200/50 p-8 sm:p-10 z-10">
    <header class="text-center mb-10">
      <figure class="inline-block bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm mb-8">
        <img src="logo.png" alt="Logo EPI PIM" class="h-16 w-auto object-contain">
      </figure>
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Acesso ao Sistema</h1>
      <p class="text-slate-500 mt-2 text-sm">Gestão de equipamentos de segurança</p>
    </header>

    
    <form [formGroup]="form" (ngSubmit)="entrar()" class="space-y-5">
      <label class="block group">
        <span class="block mb-1.5 text-xs font-semibold text-slate-700 uppercase tracking-wider pl-1">E-mail corporativo</span>
        <div class="relative">
          <i class="ph ph-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl"></i>
          <input type="email" formControlName="email" placeholder="admin@epipim.com.br"
            class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all placeholder:text-slate-400 text-slate-600">
        </div>
        @if (form.get('email')?.touched && form.get('email')?.invalid) {
          <small class="text-[11px] text-red-500 mt-1.5 flex items-center gap-1 pl-1 italic">
            <i class="ph ph-warning-circle"></i> Informe um e-mail válido
          </small>
        }
      </label>

   
      <label class="block group">
        <span class="block mb-1.5 text-xs font-semibold text-slate-700 uppercase tracking-wider pl-1">Senha de acesso</span>
        <div class="relative">
          <i class="ph ph-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl"></i>
          <input type="password" formControlName="password" placeholder="••••••••"
            class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all placeholder:text-slate-400 text-slate-600">
        </div>
        @if (form.get('password')?.touched && form.get('password')?.invalid) {
          <small class="text-[11px] text-red-500 mt-1.5 flex items-center gap-1 pl-1 italic">
            <i class="ph ph-warning-circle"></i> Senha é obrigatória
          </small>
        }
      </label>

  
      @if (error()) {
        <div role="alert" class="bg-red-50 border border-red-100 text-red-600 text-xs py-3 px-4 rounded-xl text-center animate-in fade-in slide-in-from-top-1">
          {{ error() }}
        </div>
      }

      <button type="submit" [disabled]="form.invalid || loading()"
        class="w-full py-3.5 bg-slate-900 text-white font-semibold rounded-2xl hover:bg-slate-800 active:scale-[0.98] transition-all disabled:opacity-50 disabled:pointer-events-none shadow-lg shadow-slate-200">
        {{ loading() ? 'Autenticando...' : 'Entrar no Painel' }}
      </button>

      <footer class="text-[11px] text-center text-slate-400 pt-2 leading-relaxed">
        Acesso restrito. Projeto INDT.
      </footer>
    </form>
  </section>


  <footer class="fixed bottom-6 w-full text-center z-10 pointer-events-none">
    <p class="text-slate-400 text-xs font-medium tracking-[0.2em]">
      &copy; 2026 EPI PIM • Gestão & Segurança
    </p>
  </footer>
</main>
