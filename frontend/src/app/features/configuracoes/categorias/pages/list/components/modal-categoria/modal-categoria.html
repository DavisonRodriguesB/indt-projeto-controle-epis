<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300" (click)="handleClose()"></div>

  <section class="relative bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden animate-in zoom-in duration-200">
    <header class="px-8 py-6 border-b border-slate-50 flex justify-between items-center bg-slate-50/30">
      <hgroup>
        <h3 class="font-bold text-slate-800 text-lg">
          {{ categoriaParaEdicao ? 'Editar Categoria' : 'Nova Categoria' }}
        </h3>
        <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-widest mt-0.5">Classificação de EPI</p>
      </hgroup>
      <button (click)="handleClose()" class="p-2 hover:bg-slate-100 rounded-xl text-slate-400 transition-colors">
        <i class="ph ph-x text-xl"></i>
      </button>
    </header>

    <div class="p-8">
      <form [formGroup]="formCategoria" (ngSubmit)="handleSave()" class="space-y-6">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Nome da Categoria</label>
          <div class="relative group">
            <i class="ph ph-tag absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl transition-colors group-focus-within:text-blue-500"></i>
            <input 
              type="text" 
              formControlName="descricao"
              placeholder="Ex: Proteção Auditiva"
              class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700 font-medium"
              [ngClass]="{'border-red-300 bg-red-50/30': formCategoria.get('descricao')?.invalid && formCategoria.get('descricao')?.touched}">
          </div>
          
          <span *ngIf="formCategoria.get('descricao')?.invalid && formCategoria.get('descricao')?.touched" class="text-[11px] text-red-500 font-semibold mt-2 flex items-center gap-1.5 ml-1 animate-in slide-in-from-top-1">
            <i class="ph ph-warning-circle text-sm"></i> Mínimo de 3 caracteres necessários.
          </span>
        </div>

        <button type="submit" class="hidden"></button>
      </form>
    </div>

    <footer class="px-8 py-6 bg-slate-50/50 border-t border-slate-50 flex justify-end gap-3">
      <button (click)="handleClose()" class="px-5 py-3 text-sm font-bold text-slate-400 hover:text-slate-600 hover:bg-slate-200/50 rounded-2xl transition-all">
        Cancelar
      </button>
      
      <button (click)="handleSave()" [disabled]="formCategoria.invalid" class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed text-white px-8 py-3 rounded-2xl text-sm font-bold transition-all shadow-xl shadow-blue-500/20 flex items-center gap-2 active:scale-95">
        <i class="ph" [ngClass]="categoriaParaEdicao ? 'ph-check-circle' : 'ph-plus-circle'"></i>
        {{ categoriaParaEdicao ? 'Atualizar Categoria' : 'Salvar Categoria' }}
      </button>
    </footer>
  </section>
</div>
