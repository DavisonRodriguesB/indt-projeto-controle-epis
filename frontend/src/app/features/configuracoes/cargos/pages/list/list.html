<main class="p-8 space-y-10 animate-in fade-in slide-in-from-bottom-4 duration-700">
  
  <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <hgroup>
      <h1 class="text-3xl font-semibold text-slate-800 tracking-tight">Cargos</h1>
      <p class="text-slate-500 font-medium mt-1">Gerenciamento de funções e permissões do sistema</p>
    </hgroup>

    <button 
      (click)="openModal()" 
      class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl font-semibold flex items-center gap-2 transition-all shadow-lg shadow-blue-500/20 active:scale-95">
      <i class="ph ph-plus-circle text-xl"></i>
      <span>Novo Cargo</span>
    </button>
  </header>

  
  <section class="bg-white rounded-[2.5rem] border border-slate-200/60 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="text-slate-400 text-[11px] font-semibold border-b border-slate-50 uppercase tracking-wider bg-slate-50/50">
            <th class="px-8 py-5">Descrição do Cargo</th>
            <th class="px-8 py-5 text-center">Status</th>
            <th class="px-8 py-5 text-right">Ações</th>
          </tr>
        </thead>
        
        <tbody class="divide-y divide-slate-50">
          @for (cargo of cargos(); track cargo.id) {
            <tr 
              class="group hover:bg-slate-50/50 transition-colors" 
              [ngClass]="{'opacity-60 bg-slate-50/30': !cargo.ativo}">
              
              <td class="px-8 py-5">
                <div class="flex items-center gap-4">
                  <div 
                    class="p-2.5 rounded-xl transition-colors"
                    [ngClass]="cargo.ativo ? 'bg-blue-50 text-blue-600' : 'bg-slate-100 text-slate-400'">
                    <i class="ph ph-identification-card text-xl"></i>
                  </div>
                  <span 
                    class="font-bold text-slate-700 text-sm tracking-tight"
                    [ngClass]="{'italic line-through text-slate-400': !cargo.ativo}">
                    {{ cargo.descricao }}
                  </span>
                </div>
              </td>

              
              <td class="px-8 py-5 text-center">
                <span 
                  [ngClass]="cargo.ativo ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-100 text-slate-500 border-slate-200'"
                  class="px-3 py-1 rounded-full text-[10px] font-bold border uppercase tracking-wide">
                  {{ cargo.ativo ? 'Ativo' : 'Inativo' }}
                </span>
              </td>

              
              <td class="px-8 py-5 text-right">
                <div class="flex justify-end items-center gap-3">
                  <button 
                    (click)="openModal(cargo)" 
                    class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all"
                    title="Editar Cargo">
                    <i class="ph ph-pencil-simple text-2xl"></i>
                  </button>
                  
                  <div class="h-6 w-px bg-slate-100 mx-1"></div>

                  <button 
                    (click)="toggleStatus(cargo)" 
                    class="transition-all active:scale-90"
                    [title]="cargo.ativo ? 'Desativar' : 'Ativar'">
                    <i 
                      class="ph" 
                      [ngClass]="cargo.ativo ? 'ph-toggle-right text-emerald-500' : 'ph-toggle-left text-slate-300'" 
                      style="font-size: 36px;"
                    ></i>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="py-20 text-center">
                <div class="flex flex-col items-center justify-center space-y-3">
                  <i class="ph ph-folder-not-found text-5xl text-slate-200"></i>
                  <p class="text-slate-500 font-medium text-sm">Nenhum cargo encontrado</p>
                  <p class="text-slate-400 text-xs">Comece cadastrando uma nova função para a equipe.</p>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</main>

<app-modal-cargo 
  [isOpen]="isModalOpen" 
  [cargoParaEdicao]="cargoSelecionado()"
  (onClose)="closeModal()" 
  (onSave)="salvarCargo($event)">
</app-modal-cargo>
