<section *ngIf="isOpen" class="fixed inset-0 z-[60] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300" (click)="onClose.emit()"></div>

  <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300 flex flex-col">
    
    <header class="px-8 py-6 border-b border-slate-50 flex justify-between items-center bg-emerald-50/30">
      <hgroup class="flex items-center gap-3">
        <div class="p-2.5 bg-emerald-100 text-emerald-600 rounded-2xl shadow-sm">
          <i class="ph ph-plus-circle text-xl"></i>
        </div>
        <div>
          <h3 class="font-bold text-slate-800 text-lg tracking-tight">Entrada de Material</h3>
          <p class="text-[10px] text-emerald-600 font-bold uppercase tracking-widest mt-0.5">Incrementar Estoque</p>
        </div>
      </hgroup>
      <button (click)="onClose.emit()" class="p-2 hover:bg-white/50 rounded-xl text-slate-400 transition-colors">
        <i class="ph ph-x text-xl"></i>
      </button>
    </header>

    <div class="p-8">
      <form [formGroup]="form" class="space-y-6">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Material (EPI)</label>
          <div class="relative group">
            <i class="ph ph-package absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-emerald-500 pointer-events-none transition-colors"></i>
            <select formControlName="materialCodigo" class="w-full pl-12 pr-10 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-700 outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:bg-white transition-all appearance-none cursor-pointer">
              <option value="">Selecione o EPI...</option>
              <option *ngFor="let item of estoque" [value]="item.codigo">
                {{ item.codigo }} - {{ item.material }} (Saldo: {{ item.saldo }})
              </option>
            </select>
            <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-5">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Qtd. Entrada</label>
            <input type="number" formControlName="quantidade" placeholder="0" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-700 outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:bg-white transition-all">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Anexo NF</label>
            <label class="flex items-center justify-center gap-2 w-full px-4 py-3.5 bg-white border-2 border-dashed border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-400 hover:bg-emerald-50/30 transition-all group">
              <i class="ph ph-paperclip text-lg text-slate-400 group-hover:text-emerald-500"></i>
              <span class="text-[11px] font-bold text-slate-500 group-hover:text-emerald-600 truncate max-w-[100px] uppercase tracking-tighter">
                {{ nomeArquivo || 'Anexar' }}
              </span>
              <input type="file" class="hidden" (change)="onFile.emit($event)">
            </label>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Observação / Justificativa</label>
          <textarea formControlName="observacao" rows="3" placeholder="Opcional..." class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-[1.5rem] text-sm font-medium text-slate-600 outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:bg-white transition-all resize-none"></textarea>
        </div>
      </form>
    </div>
    
    <footer class="p-8 bg-slate-50/50 border-t border-slate-100 flex gap-4">
      <button (click)="onClose.emit()" class="flex-1 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-2xl transition-all">
        Cancelar
      </button>
      <button (click)="onSalvar.emit()" [disabled]="form.invalid" class="flex-[2] py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-200 disabled:shadow-none text-white text-sm font-black uppercase tracking-widest rounded-2xl shadow-xl shadow-emerald-500/20 transition-all active:scale-95">
        Confirmar Entrada
      </button>
    </footer>
  </div>
</section>
