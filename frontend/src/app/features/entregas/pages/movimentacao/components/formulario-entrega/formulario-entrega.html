<section class="lg:col-span-1 bg-white p-8 rounded-[2.5rem] border border-slate-200/60 shadow-sm space-y-6 h-fit animate-in fade-in duration-500">
  <header class="flex items-center gap-3 border-b border-slate-50 pb-5">
    <div class="p-2 bg-blue-50 text-blue-600 rounded-xl">
      <i class="ph ph-package text-xl"></i>
    </div>
    <h3 class="font-bold text-slate-800 text-sm uppercase tracking-[0.15em]">
      Preparar Entrega
    </h3>
  </header>

  <form [formGroup]="form" class="space-y-6">
    <div>
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Colaborador</label>
      <div class="relative">
        <div class="relative group">
          <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg transition-colors group-focus-within:text-blue-500"></i>
          <input 
            type="text"
            [(ngModel)]="searchColaborador"
            [ngModelOptions]="{standalone: true}"
            (input)="showColaboradorSuggestions = true"
            (focus)="showColaboradorSuggestions = true"
            [disabled]="colaboradorFixado !== null"
            placeholder="Nome ou matrícula..."
            class="w-full pl-12 pr-12 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700 font-bold disabled:bg-blue-50/50 disabled:border-blue-100 disabled:text-blue-700 placeholder:font-medium text-sm"
          >
          <button type="button" *ngIf="searchColaborador || colaboradorFixado" (click)="limparSelecaoColaborador()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-rose-500 transition-colors">
            <i class="ph ph-x-circle text-2xl"></i>
          </button>
        </div>

        <ul *ngIf="showColaboradorSuggestions && colaboradoresFiltrados.length > 0" class="absolute z-50 w-full mt-2 bg-white border border-slate-100 rounded-2xl shadow-2xl max-h-52 overflow-y-auto p-2 animate-in slide-in-from-top-2 duration-200">
          <li *ngFor="let colab of colaboradoresFiltrados" 
              (click)="selecionarColaborador(colab)"
              class="px-4 py-3 hover:bg-blue-50 rounded-xl cursor-pointer text-sm font-bold text-slate-700 transition-colors mb-1 last:mb-0">
            {{ colab }}
          </li>
        </ul>
        <div *ngIf="showColaboradorSuggestions" (click)="showColaboradorSuggestions = false" class="fixed inset-0 z-40"></div>
      </div>
    </div>

    <div>
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Material (EPI)</label>
      <div class="relative">
        <div class="relative group">
          <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg transition-colors group-focus-within:text-blue-500"></i>
          <input 
            type="text"
            [(ngModel)]="searchEpi"
            [ngModelOptions]="{standalone: true}"
            (input)="showEpiSuggestions = true"
            (focus)="showEpiSuggestions = true"
            placeholder="Nome, código ou CA..."
            class="w-full pl-12 pr-12 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700 font-bold text-sm placeholder:font-medium"
            [class.border-red-300]="erroSaldo || erroDuplicidade"
            [class.bg-blue-50]="form.get('epiId')?.value"
          >
          <button type="button" *ngIf="searchEpi" (click)="limparSelecaoEpi()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-rose-500 transition-colors">
            <i class="ph ph-x-circle text-2xl"></i>
          </button>
        </div>

        <ul *ngIf="showEpiSuggestions && estoqueFiltrado.length > 0" class="absolute z-50 w-full mt-2 bg-white border border-slate-100 rounded-2xl shadow-2xl max-h-64 overflow-y-auto p-2 animate-in slide-in-from-top-2 duration-200">
          <li *ngFor="let item of estoqueFiltrado" 
              (click)="selecionarEpi(item)"
              [class.opacity-50]="item.saldo <= 0"
              class="flex flex-col px-4 py-3 hover:bg-slate-50 rounded-xl cursor-pointer transition-colors mb-1 last:mb-0 border-b border-slate-50/50 last:border-0">
            <div class="flex justify-between items-start gap-2">
              <span class="font-bold text-slate-700 text-xs tracking-tight">{{ item.codigo }} - {{ item.material }}</span>
              <span class="text-[9px] px-2 py-1 rounded-lg font-black uppercase whitespace-nowrap" [ngClass]="item.saldo > 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'">
                Saldo: {{ item.saldo }}
              </span>
            </div>
            <span class="text-[10px] text-blue-500 font-bold mt-1 uppercase tracking-wider">CA: {{ item.ca }}</span>
          </li>
        </ul>
        <div *ngIf="showEpiSuggestions" (click)="showEpiSuggestions = false" class="fixed inset-0 z-40"></div>
      </div>

      <div *ngIf="erroDuplicidade" class="mt-3 flex items-center gap-2 text-amber-600 bg-amber-50/50 p-3 rounded-2xl border border-amber-100 animate-in slide-in-from-top-1">
        <i class="ph ph-warning-octagon text-xl"></i>
        <span class="text-[10px] font-bold uppercase tracking-tight">{{ erroDuplicidade }}</span>
      </div>
    </div>

    <div>
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Quantidade</label>
      <input type="number" formControlName="quantidade" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all text-slate-700 font-bold text-sm">
      <div *ngIf="erroSaldo" class="mt-3 flex items-center gap-2 text-red-500 bg-red-50/50 p-3 rounded-2xl border border-red-100 animate-in slide-in-from-top-1">
        <i class="ph ph-warning-circle text-xl"></i>
        <span class="text-[10px] font-bold uppercase tracking-tight">{{ erroSaldo }}</span>
      </div>
    </div>

    <button type="button" (click)="executarInclusao()" [disabled]="form.invalid || !!erroDuplicidade" class="w-full py-4 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-100 disabled:text-slate-400 disabled:shadow-none text-white font-bold rounded-2xl transition-all flex items-center justify-center gap-3 shadow-xl shadow-blue-500/20 active:scale-95 mt-4">
      <i class="ph ph-plus-circle text-2xl"></i> 
      <span>Incluir na Lista</span>
    </button>
  </form>
</section>
